<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF8E7"/><stop offset="1" stop-color="#F4E5DB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="7" stdDeviation="0" flood-color="#2B2A4C" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2B2A4C"/></marker>
    <style>.title{font:700 42px sans-serif;fill:#2B2A4C}.subtitle{font:500 20px sans-serif;fill:#68657B}.h{font:700 27px sans-serif;fill:#2B2A4C}.p{font:500 20px sans-serif;fill:#4D4A61}.small{font:600 17px sans-serif;fill:#68657B}.node{stroke:#2B2A4C;stroke-width:3}.arrow{stroke:#2B2A4C;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="82" class="title">경영 전략은 항상 양면성을 가집니다</text>
  <text x="80" y="120" class="subtitle">빠른 성장은 큰 수익이 될 수도 있지만, 위기 때 자본을 먼저 소진할 수도 있습니다.</text>

  <rect x="565" y="180" width="470" height="115" rx="28" fill="#FFE8A8" class="node" filter="url(#shadow)"/>
  <text x="800" y="230" text-anchor="middle" class="h">플레이어의 전략 선택</text>
  <text x="800" y="268" text-anchor="middle" class="p">이번 달 회사를 어떻게 운영할까?</text>

  <rect x="100" y="370" width="590" height="380" rx="30" fill="#FFE2DC" class="node" filter="url(#shadow)"/>
  <text x="145" y="425" class="h">공격적인 성장 전략</text>
  <text x="145" y="465" class="p">고객과 매출을 빠르게 늘린다</text>
  <g transform="translate(145 505)"><rect width="500" height="54" rx="15" fill="#FFF5F2" class="node"/><text x="22" y="35" class="small">보험료 낮춤</text><text x="478" y="35" text-anchor="end" class="small">가입자 증가</text><rect y="70" width="500" height="54" rx="15" fill="#FFF5F2" class="node"/><text x="22" y="105" class="small">심사 완화</text><text x="478" y="105" text-anchor="end" class="small">승인율 증가</text><rect y="140" width="500" height="54" rx="15" fill="#FFF5F2" class="node"/><text x="22" y="175" class="small">마케팅·수수료 확대</text><text x="478" y="175" text-anchor="end" class="small">영업량 증가</text><rect y="210" width="500" height="54" rx="15" fill="#FFF5F2" class="node"/><text x="22" y="245" class="small">주식 비중 확대</text><text x="478" y="245" text-anchor="end" class="small">수익 기대</text></g>

  <rect x="910" y="370" width="590" height="380" rx="30" fill="#DDF3EC" class="node" filter="url(#shadow)"/>
  <text x="955" y="425" class="h">안정적인 생존 전략</text>
  <text x="955" y="465" class="p">위기에도 버틸 자본을 지킨다</text>
  <g transform="translate(955 505)"><rect width="500" height="54" rx="15" fill="#F7FFFC" class="node"/><text x="22" y="35" class="small">보험료 인상</text><text x="478" y="35" text-anchor="end" class="small">건당 마진 증가</text><rect y="70" width="500" height="54" rx="15" fill="#F7FFFC" class="node"/><text x="22" y="105" class="small">심사 강화</text><text x="478" y="105" text-anchor="end" class="small">위험 감소</text><rect y="140" width="500" height="54" rx="15" fill="#F7FFFC" class="node"/><text x="22" y="175" class="small">비용·배당 억제</text><text x="478" y="175" text-anchor="end" class="small">자본 보존</text><rect y="210" width="500" height="54" rx="15" fill="#F7FFFC" class="node"/><text x="22" y="245" class="small">예금·채권 중심</text><text x="478" y="245" text-anchor="end" class="small">손실 방어</text></g>

  <path d="M650 295C500 320 450 340 400 370" class="arrow"/><path d="M950 295C1100 320 1150 340 1200 370" class="arrow"/>
  <rect x="410" y="820" width="780" height="105" rx="25" fill="#DDE9FF" class="node" filter="url(#shadow)"/>
  <text x="800" y="865" text-anchor="middle" class="h">결국 비교되는 것</text>
  <text x="800" y="900" text-anchor="middle" class="p">성장 속도 · 월간 이익 · 위기 생존력 · 10년 후 최종 순자산</text>
  <path d="M400 750C520 785 600 805 670 820" class="arrow"/><path d="M1200 750C1080 785 1000 805 930 820" class="arrow"/>
</svg>
