<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF8E7"/><stop offset="1" stop-color="#F2E7D3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="6" dy="7" stdDeviation="0" flood-color="#2B2A4C" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#2B2A4C"/></marker>
    <marker id="dashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#C94F3D"/></marker>
    <style>
      .title{font:700 42px sans-serif;fill:#2B2A4C}.subtitle{font:500 20px sans-serif;fill:#68657B}.h{font:700 25px sans-serif;fill:#2B2A4C}.p{font:500 19px sans-serif;fill:#4D4A61}.small{font:600 17px sans-serif;fill:#68657B}.node{stroke:#2B2A4C;stroke-width:3}.arrow{stroke:#2B2A4C;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#C94F3D;stroke-width:3;stroke-dasharray:10 9;fill:none;marker-end:url(#dashed)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <text x="80" y="82" class="title">보험사 경영 시뮬레이션: 10년 생존 루프</text>
  <text x="80" y="120" class="subtitle">플레이어는 매달 전략을 정하고, 엔진은 한 달의 결과를 계산합니다.</text>

  <rect x="80" y="175" width="1440" height="170" rx="28" fill="#FFE8A8" class="node" filter="url(#shadow)"/>
  <text x="125" y="222" class="h">1. 이번 달 경영회의</text>
  <text x="125" y="260" class="p">CEO가 6가지 레버를 조정합니다.</text>
  <g transform="translate(125 282)">
    <rect width="190" height="42" rx="21" fill="#FFF7DC" class="node"/><text x="95" y="28" text-anchor="middle" class="small">상품 가격</text>
    <rect x="210" width="190" height="42" rx="21" fill="#FFF7DC" class="node"/><text x="305" y="28" text-anchor="middle" class="small">심사 엄격도</text>
    <rect x="420" width="190" height="42" rx="21" fill="#FFF7DC" class="node"/><text x="515" y="28" text-anchor="middle" class="small">채널 수수료</text>
    <rect x="630" width="190" height="42" rx="21" fill="#FFF7DC" class="node"/><text x="725" y="28" text-anchor="middle" class="small">마케팅비</text>
    <rect x="840" width="190" height="42" rx="21" fill="#FFF7DC" class="node"/><text x="935" y="28" text-anchor="middle" class="small">자산 배분</text>
    <rect x="1050" width="190" height="42" rx="21" fill="#FFF7DC" class="node"/><text x="1145" y="28" text-anchor="middle" class="small">배당금</text>
  </g>
  <path d="M800 345V395" class="arrow"/>

  <rect x="80" y="410" width="1440" height="220" rx="28" fill="#DDF3EC" class="node" filter="url(#shadow)"/>
  <text x="125" y="458" class="h">2. 보험사 시뮬레이션 엔진</text>
  <text x="125" y="494" class="p">고객, 계약, 사고, 자산, 재무를 한 달 앞으로 진행합니다.</text>
  <g transform="translate(125 525)">
    <rect width="245" height="68" rx="16" fill="#F8FFFC" class="node"/><text x="122" y="28" text-anchor="middle" class="small">신규 가입·해지</text><text x="122" y="52" text-anchor="middle" class="small">고객 반응</text>
    <rect x="270" width="245" height="68" rx="16" fill="#F8FFFC" class="node"/><text x="392" y="28" text-anchor="middle" class="small">사망·보험금</text><text x="392" y="52" text-anchor="middle" class="small">사고 처리</text>
    <rect x="540" width="245" height="68" rx="16" fill="#F8FFFC" class="node"/><text x="662" y="28" text-anchor="middle" class="small">만기 지급</text><text x="662" y="52" text-anchor="middle" class="small">저축성보험</text>
    <rect x="810" width="245" height="68" rx="16" fill="#F8FFFC" class="node"/><text x="932" y="28" text-anchor="middle" class="small">이자·주식 손익</text><text x="932" y="52" text-anchor="middle" class="small">자산운용</text>
    <rect x="1080" width="245" height="68" rx="16" fill="#F8FFFC" class="node"/><text x="1202" y="28" text-anchor="middle" class="small">손익·준비금·자본</text><text x="1202" y="52" text-anchor="middle" class="small">월말 결산</text>
  </g>
  <path d="M800 630V680" class="arrow"/>

  <rect x="80" y="695" width="670" height="190" rx="28" fill="#DDE9FF" class="node" filter="url(#shadow)"/>
  <text x="125" y="743" class="h">3. 결과 화면</text>
  <text x="125" y="780" class="p">순이익 · 계약자 수 · 손해율</text>
  <text x="125" y="816" class="p">자산 잔액 · 준비금 · 자본</text>
  <text x="125" y="855" class="small">다음 달 전략을 바꿀 근거</text>

  <rect x="850" y="695" width="670" height="190" rx="28" fill="#F0E5FF" class="node" filter="url(#shadow)"/>
  <text x="895" y="743" class="h">4. 상태 확인</text>
  <text x="895" y="780" class="p">자본이 남아 있으면 다음 달로 진행</text>
  <text x="895" y="816" class="p">120개월을 버티면 최종 순자산으로 점수 계산</text>
  <text x="895" y="855" class="small">자본이 0 이하이면 파산</text>

  <path d="M750 790H850" class="arrow"/>
  <path d="M1190 695C1510 620 1515 180 1300 175" class="dash"/>
  <text x="1330" y="418" class="small" fill="#C94F3D">결과를 보고 다음 달 전략 수정</text>
  <text x="80" y="950" class="subtitle">1턴 = 1개월 · 총 120턴 = 10년 · 목표 = 마지막까지 자본을 키우기</text>
</svg>
