services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - backend-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      # Local development runs over plain HTTP, so the session cookie stays
      # non-Secure with SameSite=Lax (the app defaults). Only origins listed
      # here may call the API with credentials.
      - CORS_ALLOWED_ORIGINS=http://localhost:5173

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  backend-data:
